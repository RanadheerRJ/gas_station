name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The service worker check diffs this branch against its base, so it
          # needs more than the default single-commit clone.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      # A change to src/styles.css or to a screen under src/pages/ renames the
      # content-hashed bundles the cached shell points at, so public/sw.js must
      # bump its cache version in the same pull request. Skipping that leaves
      # an already-installed phone serving the previous deploy.
      - name: Service worker cache version bumped with built assets
        if: github.event_name == 'pull_request'
        run: npm run check:sw-version -- --strict --base "origin/${{ github.base_ref }}"

      # This catches accidentally removing an RPC or weakening the migration's
      # RLS/RPC boundary without requiring Docker or a hosted Supabase project.
      - run: npm run check:schema

      # Behavioural proof of the role matrix: applies the real migrations to a
      # throwaway PostgreSQL instance and asserts what each role can read and
      # write. Static checks cannot show that an attendant is actually unable
      # to read a co-worker's takings; this does.
      - run: npm run test:rbac

      - run: npm run build
