name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      # This catches accidentally removing an RPC or weakening the migration's
      # RLS/RPC boundary without requiring Docker or a hosted Supabase project.
      - run: npm run check:schema
      - run: npm run build
