name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - run: npm ci

      - run: npm run lint
      - run: npm run format:check
      - run: npm test

      # End-to-end tests against the emulator suite: real Cloud Functions and
      # real security rules, no connection to the live project.
      - name: Install function dependencies
        run: npm ci --prefix functions

      - name: End-to-end tests against the emulators
        run: npm run test:emulator
