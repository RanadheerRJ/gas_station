name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run check:schema

      - name: Build
        env:
          # Project sites are served at /<repository>/; user/org sites use /.
          BASE_PATH: /${{ github.event.repository.name }}/
          # These repository *variables* are public browser configuration, not
          # secrets. RLS and RPCs protect data. Never expose the service key.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Fail if the Supabase browser configuration is absent
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          test -n "$VITE_SUPABASE_URL" || { echo "::error::Set repository variable VITE_SUPABASE_URL."; exit 1; }
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "::error::Set repository variable VITE_SUPABASE_ANON_KEY."; exit 1; }
          grep -rqF "$VITE_SUPABASE_URL" dist/assets/*.js || {
            echo "::error::The built bundle does not contain VITE_SUPABASE_URL."
            exit 1
          }
          if grep -rqi "firebase" dist; then
            echo "::error::Firebase code unexpectedly appeared in the Pages artifact."
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
