name: Deploy Supabase functions

# The frontend auto-deploys via deploy-pages.yml, but the `accounts` Edge
# Function only changes when someone runs `supabase functions deploy accounts`
# by hand. Every time that step is forgotten, the hosted function keeps an old
# action set and newly shipped actions answer "Unknown account action." — so
# deploy it automatically whenever the function source lands on main.
#
# One-time repository setup (Settings → Secrets and variables → Actions):
#   Secret:            SUPABASE_ACCESS_TOKEN — a Supabase personal access token
#                      (https://supabase.com/dashboard/account/tokens)
#   Variable or secret: SUPABASE_PROJECT_ID  — the project ref, e.g. abcdefghijklmnop
#
# Database migrations are intentionally NOT applied here; keep applying them
# deliberately with `supabase db push` after review.

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check configuration
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing the SUPABASE_ACCESS_TOKEN repository secret."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Missing the SUPABASE_PROJECT_ID repository variable."
            exit 1
          fi

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy the accounts function
        run: supabase functions deploy accounts --project-ref "$SUPABASE_PROJECT_ID"
