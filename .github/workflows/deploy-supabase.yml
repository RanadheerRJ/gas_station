name: Deploy Supabase migrations and functions

# The frontend auto-deploys via deploy-pages.yml. Until a station could not be
# deleted in production, this workflow shipped only the `accounts` Edge
# Function and left `supabase db push` to be remembered by hand — so a release
# that added a screen, the function action behind it, and the RPC behind that
# went live with two of its three parts applied. The button was there, the
# function answered, and the database had nothing to call.
#
# Both halves ship together now, database first: a schema that is ahead of the
# app is harmless, a UI that is ahead of the schema is the bug above.
#
# One-time repository setup (Settings → Secrets and variables → Actions):
#   Secret:            SUPABASE_ACCESS_TOKEN — a Supabase personal access token
#                      (https://supabase.com/dashboard/account/tokens)
#   Secret:            SUPABASE_DB_PASSWORD  — the project's database password
#                      (Settings → Database → Database password)
#   Variable or secret: SUPABASE_PROJECT_ID  — the project ref, e.g. abcdefghijklmnop

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
  workflow_dispatch:

# Migrations are forward-only and not reversible. Never let two runs apply to
# the same project at once, and never cancel one midway.
concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Check configuration
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing the SUPABASE_ACCESS_TOKEN repository secret."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Missing the SUPABASE_PROJECT_ID repository variable."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Missing the SUPABASE_DB_PASSWORD repository secret. \
          It is required to apply migrations; without it the app and the accounts \
          function would deploy against an older schema."
            exit 1
          fi

      # The contract check that would have caught an Edge Function calling an
      # RPC no migration defines. Cheap, and it runs before anything is applied.
      - name: Verify the schema contract
        run: node scripts/checkSupabaseSchema.mjs

      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show what is pending
        run: supabase migration list --linked

      # Before the function, so a newly shipped action always has its RPC.
      - name: Apply migrations
        run: supabase db push --linked

      - name: Deploy the accounts function
        run: supabase functions deploy accounts --project-ref "$SUPABASE_PROJECT_ID"

      - name: Confirm nothing is left pending
        run: supabase migration list --linked
