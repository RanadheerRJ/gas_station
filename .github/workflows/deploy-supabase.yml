name: Deploy Supabase migrations and functions

# Deploy the database first: a schema ahead of the app is harmless, while a
# UI or Edge Function ahead of its RPC is not. The Management API uses the
# existing access token and does not require the database password.
#
# Required repository configuration:
#   Secret:   SUPABASE_ACCESS_TOKEN — a Supabase personal access token
#   Variable or secret: SUPABASE_PROJECT_ID — the project ref

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "scripts/applyMigrations.mjs"
  workflow_dispatch:

concurrency:
  group: deploy-supabase
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID || secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check configuration
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Missing the SUPABASE_ACCESS_TOKEN repository secret."
            exit 1
          fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then
            echo "::error::Missing the SUPABASE_PROJECT_ID repository variable."
            exit 1
          fi

      - name: Verify the schema contract
        run: node scripts/checkSupabaseSchema.mjs

      - name: Apply migrations through the Management API
        run: node scripts/applyMigrations.mjs

      - name: Deploy the accounts function
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy accounts --project-ref "$SUPABASE_PROJECT_ID"
