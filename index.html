    <script>
      !(function () {
        try {
          var t =
            localStorage.getItem("petrav.theme") ||
            localStorage.getItem("pumpmithra.theme");
          if (!t)
            t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
